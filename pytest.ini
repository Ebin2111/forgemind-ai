[pytest]
# Run from the project root:   pytest              (all tests)
#                              pytest -k generation (by name)
#                              pytest backend/app/tests/test_api.py -x
minversion = 8.0
testpaths = backend/app/tests

# The app is imported as `backend.app...`, so the project root must be importable.
pythonpath = .

python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Never walk into frontend dependencies, build output or runtime data.
norecursedirs =
    node_modules
    .next
    .git
    .venv
    venv
    frontend
    data
    evaluation
    __pycache__

addopts =
    -ra
    --strict-config
    --strict-markers
    --tb=short

# Treat deprecations in our own code as failures so they are fixed early,
# while leaving third-party packages free to warn.
filterwarnings =
    error::DeprecationWarning
    error::PendingDeprecationWarning
    error::pytest.PytestUnraisableExceptionWarning
    # Newer Starlette warns that its TestClient prefers 'httpx2'. It is a third-party notice, not our code.
    ignore:Using .httpx. with .starlette.testclient. is deprecated:DeprecationWarning

# Tests build a temporary database and data folders (see tests/conftest.py); logs stay quiet.
log_level = WARNING